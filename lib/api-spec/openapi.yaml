openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: TAPO – Tagging dan Analisis Perubahan Objek Perumahan API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: housing
    description: Housing data for Kelurahan Boting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /housing/boting:
    get:
      operationId: listHouses
      tags: [housing]
      summary: List all housing records with optional filters
      parameters:
        - in: query
          name: statusPerubahan
          schema:
            type: string
            enum: [berubah, tidak_berubah]
          required: false
        - in: query
          name: jenisPerubahan
          schema:
            type: string
            enum:
              [
                perubahanPagar,
                perubahanLuasBangunan,
                perubahanJumlahLantai,
                perubahanJenisLantai,
                perubahanJenisDinding,
                perubahanLuasLahan,
                perubahanJenisAtap,
              ]
          required: false
        - in: query
          name: kondisiBangunan
          schema:
            type: string
          required: false
        - in: query
          name: rt
          schema:
            type: string
          required: false
        - in: query
          name: rw
          schema:
            type: string
          required: false
        - in: query
          name: klaster
          schema:
            type: string
            enum: [K1, K2, K3]
          required: false
        - in: query
          name: jeniLantai
          schema:
            type: string
          required: false
        - in: query
          name: jenisDinding
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of housing records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"

  /housing/boting/summary:
    get:
      operationId: getHousingSummary
      tags: [housing]
      summary: Get summary statistics
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSummary"

  /housing/boting/chart-data:
    get:
      operationId: getHousingChartData
      tags: [housing]
      summary: Get chart-ready breakdowns
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingChartData"

  /housing/boting/changes:
    get:
      operationId: listChangedHouses
      tags: [housing]
      summary: List only houses that have changed
      responses:
        "200":
          description: Changed houses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"

  /housing/boting/insight:
    get:
      operationId: getHousingInsight
      tags: [housing]
      summary: Smart insight based on active filters
      parameters:
        - in: query
          name: statusPerubahan
          schema:
            type: string
          required: false
        - in: query
          name: jenisPerubahan
          schema:
            type: string
          required: false
        - in: query
          name: rt
          schema:
            type: string
          required: false
        - in: query
          name: rw
          schema:
            type: string
          required: false
        - in: query
          name: klaster
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Smart insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingInsight"

  /housing/boting/metadata:
    get:
      operationId: getHousingMetadata
      tags: [housing]
      summary: Get dataset metadata
      responses:
        "200":
          description: Dataset metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetMetadata"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    House:
      type: object
      required:
        - id
        - nomorUrut
        - namaKepalaKeluarga
        - alamat
        - rt
        - rw
        - lat
        - lng
        - statusPerubahan
        - kondisiBangunan
        - klaster
        - perubahanPagar
        - perubahanLuasBangunan
        - perubahanJumlahLantai
        - perubahanJenisLantai
        - perubahanJenisDinding
        - perubahanLuasLahan
        - perubahanJenisAtap
        - jumlahJenisPerubahan
      properties:
        id:
          type: string
        nomorUrut:
          type: number
          format: int32
        namaKepalaKeluarga:
          type: string
        alamat:
          type: string
        rt:
          type: string
        rw:
          type: string
        lat:
          type: number
        lng:
          type: number
        statusPerubahan:
          type: string
          enum: [berubah, tidak_berubah]
        kondisiBangunan:
          type: string
          description: "Baik, Rusak Ringan, Rusak Berat"
        klaster:
          type: string
          enum: [K1, K2, K3]
          description: "K1=Tidak/Sedikit Berubah, K2=Perubahan Sedang, K3=Perubahan Signifikan"
        jumlahJenisPerubahan:
          type: number
          format: int32
          description: Total number of change types experienced
        luasBangunan:
          type: ["number", "null"]
          description: Luas bangunan dalam m2
        luasLahan:
          type: ["number", "null"]
          description: Luas lahan dalam m2
        jeniLantai:
          type: ["string", "null"]
          description: "Semen, Keramik, Marmer/Granit, Kayu"
        jenisDinding:
          type: ["string", "null"]
          description: "Tembok, Kayu, Bambu, Seng"
        jumlahLantai:
          type: ["number", "null"]
          format: int32
        jenisAtap:
          type: ["string", "null"]
          description: "Genteng, Seng, Asbes"
        jenisPlafon:
          type: ["string", "null"]
          description: "Triplek/Asbes/Bambu, Beton, PVC, Tidak Ada, dll."
        pagar:
          type: ["string", "null"]
          description: "Ada (Tembok), Ada (Kayu), Tidak Ada"
        tahunDatang:
          type: ["number", "null"]
          format: int32
        keterangan:
          type: ["string", "null"]
        perubahanPagar:
          type: boolean
        perubahanLuasBangunan:
          type: boolean
        perubahanJumlahLantai:
          type: boolean
        perubahanJenisLantai:
          type: boolean
        perubahanJenisDinding:
          type: boolean
        perubahanLuasLahan:
          type: boolean
        perubahanJenisAtap:
          type: boolean

    HousingSummary:
      type: object
      required:
        - totalRumah
        - rumahBerubah
        - rumahTidakBerubah
        - persenPerubahan
        - byJenisPerubahan
        - byKondisi
        - byRt
        - byKlaster
        - byJenisLantai
        - byJenisDinding
      properties:
        totalRumah:
          type: number
          format: int32
        rumahBerubah:
          type: number
          format: int32
        rumahTidakBerubah:
          type: number
          format: int32
        persenPerubahan:
          type: number
        byJenisPerubahan:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byKondisi:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byRt:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byKlaster:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byJenisLantai:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byJenisDinding:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    HousingChartData:
      type: object
      required:
        - jenisPerubahan
        - kondisiBangunan
        - statusPerRt
        - klasterDistribution
      properties:
        jenisPerubahan:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        kondisiBangunan:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        statusPerRt:
          type: array
          items:
            $ref: "#/components/schemas/RtBreakdown"
        klasterDistribution:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    HousingInsight:
      type: object
      required:
        - ringkasan
        - poin
      properties:
        ringkasan:
          type: string
        poin:
          type: array
          items:
            type: string

    DatasetMetadata:
      type: object
      required:
        - namaDataset
        - periodeData
        - sumberData
        - unitObservasi
        - cakupanWilayah
        - jumlahObservasi
        - informasiKoordinat
        - variabel
      properties:
        namaDataset:
          type: string
        periodeData:
          type: string
        sumberData:
          type: string
        unitObservasi:
          type: string
        cakupanWilayah:
          type: string
        jumlahObservasi:
          type: number
          format: int32
        informasiKoordinat:
          type: string
        keteranganIndikator:
          type: ["string", "null"]
        variabel:
          type: array
          items:
            $ref: "#/components/schemas/VariabelMetadata"

    VariabelMetadata:
      type: object
      required:
        - nama
        - deskripsi
        - tipe
      properties:
        nama:
          type: string
        deskripsi:
          type: string
        tipe:
          type: string
        nilaiValid:
          type: ["string", "null"]

    CategoryCount:
      type: object
      required:
        - label
        - jumlah
      properties:
        label:
          type: string
        jumlah:
          type: number
          format: int32

    RtBreakdown:
      type: object
      required:
        - rt
        - berubah
        - tidakBerubah
        - total
      properties:
        rt:
          type: string
        berubah:
          type: number
          format: int32
        tidakBerubah:
          type: number
          format: int32
        total:
          type: number
          format: int32
